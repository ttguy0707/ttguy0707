
<svg width="720" height="150" viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3D57"/>
      <stop offset="18%" stop-color="#FFB000"/>
      <stop offset="36%" stop-color="#00D66B"/>
      <stop offset="54%" stop-color="#00D9FF"/>
      <stop offset="72%" stop-color="#3578FF"/>
      <stop offset="90%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF3D57"/>
      <animate attributeName="x1" values="-180;120;-180" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="540;900;540" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="rainbowGlow" x="-20%" y="-70%" width="140%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <style>
    .logo {
      font-family: Impact, Haettenschweiler, "Arial Black", "Fira Code", "JetBrains Mono", sans-serif;
      font-size: 92px;
      font-weight: 900;
      font-style: normal;
      letter-spacing: 16px;
      fill: rgba(255, 255, 255, 0.08);
      stroke: url(#rainbow);
      stroke-width: 3;
      filter: url(#rainbowGlow);
    }

    .glow {
      font-family: Impact, Haettenschweiler, "Arial Black", "Fira Code", "JetBrains Mono", sans-serif;
      font-size: 92px;
      font-weight: 900;
      font-style: normal;
      letter-spacing: 16px;
      fill: url(#rainbow);
      opacity: 0.16;
      filter: blur(7px);
    }

  </style>


  <text class="logo" x="360" y="106" text-anchor="middle">ALLEN</text>
</svg>
